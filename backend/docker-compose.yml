services:
  # ──────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    container_name: interaedu-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: interaedu
      POSTGRES_USER: interaedu
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Gere backend/.env com .scripts/init-env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interaedu -d interaedu']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    container_name: interaedu-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    build:
      context: .
      dockerfile: storage/Dockerfile
    container_name: interaedu-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ──────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────
  gateway:
    build:
      context: .          # backend/ root — provides package-lock.json for npm ci
      dockerfile: gateway/Dockerfile
    container_name: interaedu-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Configure INTERNAL_SERVICE_TOKEN}
      SERVICE_PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      PROFILE_SERVICE_URL: http://profile-service:3002
      FEED_SERVICE_URL: http://feed-service:3003
      MESSAGING_SERVICE_URL: http://messaging-service:3004
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET}
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: .          # backend/ root — provides package-lock.json for npm ci
      dockerfile: auth-service/Dockerfile
    container_name: interaedu-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Configure INTERNAL_SERVICE_TOKEN}
      SERVICE_NAME: auth-service
      SERVICE_PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: interaedu
      DATABASE_USERNAME: interaedu
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Gere backend/.env com .scripts/init-env.py}
      DATABASE_SCHEMA: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Configure JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      ALLOW_DEV_OTP_LOG: ${ALLOW_DEV_OTP_LOG:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-InteraEdu <onboarding@resend.dev>}
      # Configurar em .env (ver docs/walkthrough-sessao.md §B-03) — opcional.
      # Sem GOOGLE_CLIENT_ID, o endpoint /auth/google responde 503.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  profile-service:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    container_name: interaedu-profile-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Configure INTERNAL_SERVICE_TOKEN}
      SERVICE_NAME: profile-service
      SERVICE_PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: interaedu
      DATABASE_USERNAME: interaedu
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Gere backend/.env com .scripts/init-env.py}
      DATABASE_SCHEMA: profile
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET}
      MESSAGING_SERVICE_URL: http://messaging-service:3004
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: interaedu
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY}
      S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  feed-service:
    build:
      context: .
      dockerfile: feed-service/Dockerfile
    container_name: interaedu-feed-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Configure INTERNAL_SERVICE_TOKEN}
      SERVICE_NAME: feed-service
      SERVICE_PORT: 3003
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: interaedu
      DATABASE_USERNAME: interaedu
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Gere backend/.env com .scripts/init-env.py}
      DATABASE_SCHEMA: feed
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET}
      PROFILE_SERVICE_URL: http://profile-service:3002
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: interaedu
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY}
      S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  messaging-service:
    build:
      context: .
      dockerfile: messaging-service/Dockerfile
    container_name: interaedu-messaging-service
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Configure INTERNAL_SERVICE_TOKEN}
      SERVICE_NAME: messaging-service
      SERVICE_PORT: 3004
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: interaedu
      DATABASE_USERNAME: interaedu
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Gere backend/.env com .scripts/init-env.py}
      DATABASE_SCHEMA: messaging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET}
      PROFILE_SERVICE_URL: http://profile-service:3002
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: interaedu
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY}
      S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────
  # Observabilidade — B-06 (Prometheus + Grafana)
  # ──────────────────────────────────────────
  prometheus:
    profiles: ['observability']
    image: prom/prometheus:latest@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: interaedu-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    profiles: ['observability']
    image: grafana/grafana:latest@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: interaedu-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3030:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Configure GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
