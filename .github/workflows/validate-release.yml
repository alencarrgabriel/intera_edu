name: Validar candidata a release
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  harness:
    name: Harness Flutter e backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: flutter pub get --enforce-lockfile
      - run: python .scripts/check-hygiene.py
      - run: python .scripts/run-tests.py
      - name: Conferir documentação derivada do código
        run: |
          node .scripts/generate-as-built.cjs
          git diff --exit-code -- docs/entrega/contratos-as-built.md docs/entrega/modelos-as-built.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: reports/release
          if-no-files-found: error
  docker:
    name: Stack Docker e smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 .scripts/init-env.py
      - name: Validar e iniciar stack de demonstração
        run: |
          docker compose --env-file backend/.env config --quiet
          docker compose --env-file backend/.env up --build -d --wait --wait-timeout 240
      - run: node .scripts/smoke-test.mjs
      - name: Verificar harness em container
        run: docker compose -f compose.test.yaml run --build --rm harness
      - name: Exportar aplicação web
        run: |
          mkdir -p build/release-web
          docker compose --env-file backend/.env cp web:/usr/share/nginx/html/. build/release-web/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence-${{ github.sha }}
          path: reports/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-web-${{ github.sha }}
          path: build/release-web
      - name: Encerrar containers
        if: always()
        run: docker compose --env-file backend/.env down
