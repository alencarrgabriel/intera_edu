name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API Base URL'
        required: true
        default: 'http://10.0.2.2:3000/api/v1'
      ws_base_url:
        description: 'WebSocket Base URL'
        required: true
        default: 'http://10.0.2.2:3004'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable

      - run: flutter pub get

      - name: Compilar APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          WS_BASE_URL: ${{ inputs.ws_base_url }}
        run: flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="WS_BASE_URL=$WS_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
